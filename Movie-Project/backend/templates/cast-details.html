{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ details.name }}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="text-light" style="background-color: #121212;">

<div class="container py-5">

    <div class="card bg-black border-secondary shadow-lg">

        <div class="row g-0">

            <!-- Image -->
            <div class="col-md-4">

                <img src="{{ details.picture.url }}"
                     class="img-fluid rounded-start h-100"
                     alt="{{ details.name }}">

            </div>

            <!-- Details -->
            <div class="col-md-8">

                <div class="card-body p-4">

                    <h1 class="display-5 fw-bold text-warning">
                        {{ details.name }}
                    </h1>

                    <div class="mb-3">

                        {% for role in roles %}
                        <span class="badge bg-warning text-dark rounded-pill px-3 py-2 me-2">
                            {{ role }}
                        </span>
                        {% endfor %}

                    </div>

                    <p class="text-secondary fs-5">
                        📍 {{ details.place }}
                    </p>

                    <hr class="border-secondary">

                    <h4 class="text-warning mb-3">
                        About
                    </h4>

                    <p class="text-light">
                        {{ details.about }}
                    </p>

                </div>

            </div>

        </div>

    </div>

    <!-- Filmography -->
    <div class="mt-5">

        <h2 class="text-warning mb-4">
            Filmography
        </h2>

        <div class="row g-4">

            {% for movie in movies %}

            <div class="col-lg-3 col-md-4 col-sm-6">

                <div class="card bg-black border-secondary h-100">

                    <a href="{% url 'movie_details' movie.id %}">
                        <img src="{{ movie.poster.url }}"
                             class="card-img-top"
                             alt="{{ movie.movie }}">
                    </a>

                    <div class="card-body text-center">

                        <h6 class="text-light mb-0">
                            {{ movie.movie }}
                        </h6>

                    </div>

                </div>

            </div>

            {% empty %}

            <div class="col-12">

                <div class="alert alert-dark border-secondary">
                    No movies available.
                </div>

            </div>

            {% endfor %}

        </div>

    </div>

    <div class="text-center mt-5">

        <a href="javascript:history.back()"
           class="btn btn-warning btn-lg px-5">
            ← Back
        </a>

    </div>

</div>

</body>

</html>
