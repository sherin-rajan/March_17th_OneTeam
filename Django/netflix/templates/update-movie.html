<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Movie</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-black shadow">
        <div class="container">
            <a class="navbar-brand fw-bold text-warning fs-3" href="/">🎬 MovieHub</a>

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/add-category">Add Category</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/all-movies">Movie List</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="#">Update Movie</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Form -->
    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-7">

                <h1 class="text-center text-warning fw-bold mb-4">
                    ✏️ Update Movie
                </h1>

                <hr class="border-warning mb-5">

                <form method="post" enctype="multipart/form-data">

                    {% csrf_token %}

                    <div class="mb-4">
                        <label class="form-label">Movie Name</label>
                        <input type="text"
                               name="movie"
                               value="{{ cinema.movie }}"
                               class="form-control form-control-lg">
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Category</label>
                        <select name="category" class="form-select form-select-lg">

                            {% for c in cats %}
                                <option value="{{ c.id }}"
                                    {% if c.id == cinema.category.id %}selected{% endif %}>
                                    {{ c.category }}
                                </option>
                            {% endfor %}

                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Release Date</label>
                        <input type="date"
                               name="release_date"
                               value="{{ cinema.release_date|date:'Y-m-d' }}"
                               class="form-control form-control-lg">
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Description</label>
                        <textarea name="description"
                                  rows="5"
                                  class="form-control">{{ cinema.description }}</textarea>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Current Poster</label><br>

                        <img src="{{ cinema.poster.url }}"
                             class="img-thumbnail mb-3"
                             style="max-width:180px;">

                        <input type="file"
                               name="poster"
                               class="form-control">
                    </div>

                    <div class="mb-5">
                        <label class="form-label">Trailer Link</label>
                        <input type="url"
                               name="trailer_link"
                               value="{{ cinema.trailer_link }}"
                               class="form-control form-control-lg">
                    </div>

                    <div class="d-grid">
                        <button type="submit"
                                class="btn btn-warning btn-lg fw-semibold">
                            💾 Update Movie
                        </button>
                    </div>

                </form>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
