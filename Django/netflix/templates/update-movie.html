{% extends 'base.html' %}

{% block title %}Update Movie | MovieFlix{% endblock %}

{% block content %}
    <!-- Form -->
    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-7">

                <h1 class="text-center text-warning fw-bold mb-4">
                    ✏️ Update Movie
                </h1>

                <hr class="border-warning mb-5">

                <form method="post" enctype="multipart/form-data">

                    {% csrf_token %}

                    <div class="mb-4">
                        <label class="form-label">Movie Name</label>
                        <input type="text"
                               name="movie"
                               value="{{ cinema.movie }}"
                               class="form-control form-control-lg">
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Category</label>
                        <select name="category" class="form-select form-select-lg">

                            {% for c in cats %}
                                <option value="{{ c.id }}"
                                    {% if c.id == cinema.category.id %}selected{% endif %}>
                                    {{ c.category }}
                                </option>
                            {% endfor %}

                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Release Date</label>
                        <input type="date"
                               name="release_date"
                               value="{{ cinema.release_date|date:'Y-m-d' }}"
                               class="form-control form-control-lg">
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Description</label>
                        <textarea name="description"
                                  rows="5"
                                  class="form-control">{{ cinema.description }}</textarea>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Current Poster</label><br>

                        <img src="{{ cinema.poster.url }}"
                             class="img-thumbnail mb-3"
                             style="max-width:180px;">

                        <input type="file"
                               name="poster"
                               class="form-control">
                    </div>

                    <div class="mb-5">
                        <label class="form-label">Trailer Link</label>
                        <input type="url"
                               name="trailer_link"
                               value="{{ cinema.trailer_link }}"
                               class="form-control form-control-lg">
                    </div>

                    <div class="d-grid">
                        <button type="submit"
                                class="btn btn-warning btn-lg fw-semibold">
                            💾 Update Movie
                        </button>
                    </div>

                </form>

            </div>

        </div>

    </div>

{% endblock %}
