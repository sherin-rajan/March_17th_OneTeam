<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie List</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-black shadow">
        <div class="container">
            <a class="navbar-brand text-warning fw-bold fs-3" href="/">🎬 MovieHub</a>

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/add-category">Add Category</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="/all-movies">Movie List</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/add-movie">Add Movies</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Movie List -->
    <div class="container py-5">

        <h1 class="text-center text-warning fw-bold mb-5">
            🎥 Movie List
        </h1>

        <div class="row g-5">

            {% for m in movies %}

            <div class="col-12 col-sm-6 col-md-4 col-lg-3">

                <div class="text-center">

                    <img src="{{ m.poster.url }}"
                         class="img-fluid rounded shadow"
                         style="height:350px; object-fit:cover;"
                         alt="{{ m.movie }}">

                    <h5 class="mt-3 fw-semibold">
                        {{ m.movie }}
                    </h5>

                    <div class="mt-3 d-flex justify-content-center gap-2">

                        <a href="/movie-detail/{{ m.id }}"
                           class="btn btn-warning btn-sm">
                            Details
                        </a>

                        <a href="/delete-movie/{{ m.id }}"
                           class="btn btn-outline-danger btn-sm"
                           onclick="return confirmDelete()">
                            Delete
                        </a>

                    </div>

                </div>

            </div>

            {% empty %}

            <div class="col-12 text-center">
                <h4 class="text-secondary">No movies available.</h4>
            </div>

            {% endfor %}

        </div>

    </div>

    <script>
        function confirmDelete() {
            return confirm("Do you wish to delete this movie?");
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
