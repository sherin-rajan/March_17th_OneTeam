{% extends 'base.html' %}

{% block title %}All Movies | MovieFlix{% endblock %}

{% block content %}
<!-- Movie List -->
<div class="container py-5">

    <h1 class="text-center text-warning fw-bold mb-5">
        🎥 Movie List
    </h1>

    <div class="row g-5">

        {% for m in movies %}

        <div class="col-12 col-sm-6 col-md-4 col-lg-3">

            <div class="text-center">

                <img src="{{ m.poster.url }}" class="img-fluid rounded shadow" style="height:300px; object-fit:cover;"
                    alt="{{ m.movie }}">

                <h5 class="mt-3 fw-semibold">
                    {{ m.movie }}
                </h5>

                <div class="mt-3 d-flex justify-content-center gap-2">


                    <a href="{% url 'movie_details' m.id %}" class="btn btn-warning btn-sm">
                        Details
                    </a>

                    <a href="{% url 'delete_movie' m.id %}" class="btn btn-outline-danger btn-sm"
                        onclick="return confirmDelete()">
                        Delete
                    </a>

                </div>

            </div>

        </div>

        {% empty %}

        <div class="col-12 text-center">
            <h4 class="text-secondary">No movies available.</h4>
        </div>

        {% endfor %}

    </div>

</div>

<script>
    function confirmDelete() {
        return confirm("Do you wish to delete this movie?");
    }
</script>
{% endblock %}
