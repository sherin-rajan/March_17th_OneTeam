{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | MovieHub</title>

    <link rel="stylesheet" href="{% static 'css/accounts.css' %}">
</head>
<body>

<!-- Navbar -->
<nav>
    <div class="navbar">

        <a href="{% url 'home' %}" class="logo">
            🎬 MovieHub
        </a>

        <a href="{% url 'home' %}" class="home-btn">
            Home
        </a>

    </div>
</nav>

<!-- Register Card -->

<div class="container">

    <div class="card">

        <h2>Create Account</h2>

        <p class="subtitle">
            Join MovieHub and start exploring movies.
        </p>

        <form method="POST" action="{% url 'register' %}">
            {% csrf_token %}

            <input type="text"
                   name="first_name"
                   placeholder="First Name"
                   required>

            <input type="text"
                   name="last_name"
                   placeholder="Last Name"
                   required>

            <input type="email"
                   name="email"
                   placeholder="Email"
                   required>

            <input type="password"
                   name="password1"
                   placeholder="Password"
                   required>

            <input type="password"
                   name="password2"
                   placeholder="Confirm Password"
                   required>

            <button type="submit">
                Register
            </button>

        </form>

        <p class="bottom-text">
            Already have an account?
            <a href="{% url 'login' %}">Login</a>
        </p>

    </div>

</div>

</body>
</html>
