{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | MovieHub</title>

    <link rel="stylesheet" href="{% static 'css/accounts.css' %}">
</head>
<body>

<!-- Navbar -->
<nav>
    <div class="navbar">

        <a href="{% url 'home' %}" class="logo">
            🎬 MovieHub
        </a>

        <a href="{% url 'home' %}" class="home-btn">
            Home
        </a>

    </div>
</nav>

<!-- Login -->

<div class="container">

    <div class="card">

        <h2>Welcome Back</h2>

        <p class="subtitle">
            Login to continue to your MovieHub account.
        </p>

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}

            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required>

            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required>

            <button type="submit">
                Login
            </button>

        </form>

        <p class="bottom-text">
            Don't have an account?
            <a href="{% url 'register' %}">Register</a>
        </p>

    </div>

</div>

</body>
</html>
