{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{details.name}}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-light">

    <div class="container py-5">

        <!-- Name -->
        <div class="mb-4">
            <h5 class="text-secondary text-uppercase">Films Starring</h5>

            <h1 class="fw-bold text-warning">
                {{details.name}}
            </h1>

        </div>

        <hr class="border-secondary">

        <div class="row">

            <!-- Movies -->
            <div class="col-lg-6">

                <div class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-4">

                    <div class="col">
                        <div class="card bg-black border-secondary">
                            <img src="https://placehold.co/300x450?text=Movie+1" class="card-img-top">
                            <div class="card-body">
                                <h6 class="text-center text-light">Movie One</h6>
                            </div>
                        </div>
                    </div>

                    <div class="col">
                        <div class="card bg-black border-secondary">
                            <img src="https://placehold.co/300x450?text=Movie+2" class="card-img-top">
                            <div class="card-body">
                                <h6 class="text-center text-light">Movie Two</h6>
                            </div>
                        </div>
                    </div>

                    <div class="col">
                        <div class="card bg-black border-secondary">
                            <img src="https://placehold.co/300x450?text=Movie+3" class="card-img-top">
                            <div class="card-body">
                                <h6 class="text-center text-light">Movie Three</h6>
                            </div>
                        </div>
                    </div>

                    <div class="col">
                        <div class="card bg-black border-secondary">
                            <img src="https://placehold.co/300x450?text=Movie+4" class="card-img-top">
                            <div class="card-body">
                                <h6 class="text-center text-light">Movie Four</h6>
                            </div>
                        </div>
                    </div>

                    <div class="col">
                        <div class="card bg-black border-secondary">
                            <img src="https://placehold.co/300x450?text=Movie+5" class="card-img-top">
                            <div class="card-body">
                                <h6 class="text-center text-light">Movie Five</h6>
                            </div>
                        </div>
                    </div>

                    <div class="col">
                        <div class="card bg-black border-secondary">
                            <img src="https://placehold.co/300x450?text=Movie+6" class="card-img-top">
                            <div class="card-body">
                                <h6 class="text-center text-light">Movie Six</h6>
                            </div>
                        </div>
                    </div>

                    <div class="col">
                        <div class="card bg-black border-secondary">
                            <img src="https://placehold.co/300x450?text=Movie+7" class="card-img-top">
                            <div class="card-body">
                                <h6 class="text-center text-light">Movie Seven</h6>
                            </div>
                        </div>
                    </div>

                    <div class="col">
                        <div class="card bg-black border-secondary">
                            <img src="https://placehold.co/300x450?text=Movie+8" class="card-img-top">
                            <div class="card-body">
                                <h6 class="text-center text-light">Movie Eight</h6>
                            </div>
                        </div>
                    </div>

                </div>

            </div>

            <!-- Profile -->
            <div class="col-lg-4">

                <div class="card bg-black border-secondary shadow">

                    <img src="{{details.picture.url}}"
                        class="card-img-top"
                        alt="Actor">

                    <div class="card-body">

                        <h3 class="text-warning">
                            {{details.name}}
                        </h3>

                        <p class="text-secondary">
                             {{details.place}}
                        </p>

                        <hr class="border-secondary">

                        <h5 class="text-info">
                            About
                        </h5>

                        <p class="text-light">
                            {{details.about}}
                        </p>

                    </div>

                </div>

            </div>

        </div>

        <div class="text-center mt-5">

            <a href="#" class="btn btn-warning btn-lg px-5">
                ← Back
            </a>

        </div>

    </div>

</body>

</html>
