{% extends 'base.html' %}

{% block title %}Add Movie | MovieFlix{% endblock %}

{% block content %}
    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-7">

                <h1 class="text-center text-warning fw-bold mb-4">
                    🎥 Add New Movie
                </h1>

                <hr class="border-warning mb-5">

                <form method="post" enctype="multipart/form-data">

                    {% csrf_token %}

                    <div class="mb-4">
                        <label class="form-label">Movie Name</label>
                        <input type="text"
                               name="movie"
                               class="form-control form-control-lg"
                               placeholder="Enter movie name">
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Category</label>
                        <select name="category" class="form-select form-select-lg">
                            {% for c in cats %}
                            <option value="{{c.id}}">
                                {{c.category}}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Release Date</label>
                        <input type="date"
                               name="release_date"
                               class="form-control form-control-lg">
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Description</label>
                        <textarea name="description"
                                  rows="5"
                                  class="form-control"
                                  placeholder="Write a short description..."></textarea>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Movie Poster</label>
                        <input type="file"
                               name="poster"
                               class="form-control">
                    </div>

                    <div class="mb-5">
                        <label class="form-label">Trailer Link</label>
                        <input type="url"
                               name="trailer_link"
                               class="form-control form-control-lg"
                               placeholder="https://youtube.com/...">
                    </div>

                    <div class="d-grid">
                        <button type="submit"
                                class="btn btn-warning btn-lg fw-semibold">
                            🎬 Add Movie
                        </button>
                    </div>

                </form>

            </div>

        </div>

    </div>
{% endblock %}
