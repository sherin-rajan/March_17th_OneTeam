<!DOCTYPE html>
<html>
<head>
    <title>Student Task Management</title>
</head>

<body>
    <h1>Student Task Management</h1>
    <form id="studentForm">
        <label>Student Name:</label>
        <input type="text" id="studentName">
        <br><br>
        <label>Subject:</label>
        <input type="text" id="subject">
        <br><br>
        <label>Marks:</label>
        <input type="number" id="marks">
        <br><br>
        <button type="submit">Add Student</button>
    </form>
    <br>
    <p id="message"></p>
    <h2>Student Records</h2>
    <table border="1">
        <thead>
            <tr>
                <th>Name</th>
                <th>Subject</th>
                <th>Marks</th>
                <th>Result</th>
            </tr>
        </thead>
        <tbody id="studentTableBody"></tbody>
    </table>
    <br>
    <button id="averageButton">Calculate Average</button>
    <button id="removeButton">Remove Student</button>
    <p id="averageResult"></p>
    <script src="script.js"></script>
</body>
</html>
